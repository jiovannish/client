name: CLI checks and releases

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      CARGO_TERM_COLOR: always
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Check TypeScript tooling
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run typecheck
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Check and test the CLI
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked -p jio-cli -p jio-client --all-targets -- -D warnings
          cargo test --locked -p jio-cli -p jio-client
          RUSTDOCFLAGS='-D warnings' cargo doc --locked -p jio-cli -p jio-client --no-deps
          if [ "$RUNNER_OS" != Windows ]; then bun run test:installer; fi
      - name: Build and package the native binary
        run: |
          cargo build --locked --release -p jio-cli --target "$TARGET"
          cargo install --locked cargo-bundle-licenses --version 4.2.0
          bun run package:cli "$TARGET"
      - name: Test SDK with Bun
        if: runner.os != 'Windows'
        run: |
          bun run --bun --cwd bindings/node build:debug
          bun run test:node
      - name: Test native Windows installer
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/test-install.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jio-${{ matrix.target }}
          path: target/dist/jio-${{ matrix.target }}.*
          if-no-files-found: error
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: jio-*
          merge-multiple: true
      - name: Create a draft for review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^    version=//p' install.sh)
          test "$RELEASE_TAG" = "v$version"
          cp install.sh install.ps1 dist/
          cd dist
          test "$(find . -name 'jio-*.tar.gz' | wc -l)" -eq 4
          test "$(find . -name 'jio-*.zip' | wc -l)" -eq 1
          sha256sum jio-*.tar.gz jio-*.zip install.sh install.ps1 > SHA256SUMS
          gh release create "$RELEASE_TAG" --verify-tag --draft \
            --title "Jio Client $RELEASE_TAG" \
            --notes-file ../.github/release-notes.md \
            jio-*.tar.gz jio-*.zip install.sh install.ps1 SHA256SUMS
