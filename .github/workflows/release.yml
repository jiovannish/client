name: CLI checks and releases

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    uses: jiovannish/client/.github/workflows/linux.yml@9af64c2fb7ca2009cc06f238ecbb7d9a4f9ead76

  build:
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      CARGO_TERM_COLOR: always
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Check TypeScript tooling
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run typecheck
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Check and test the CLI
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked -p jio-cli -p jio-client --all-targets -- -D warnings
          cargo test --locked -p jio-cli -p jio-client
          RUSTDOCFLAGS='-D warnings' cargo doc --locked -p jio-cli -p jio-client --no-deps
          if [ "$RUNNER_OS" != Windows ]; then bun run test:installer; fi
      - name: Build and package the native binary
        run: |
          cargo build --locked --release -p jio-cli --target "$TARGET"
          cargo install --locked cargo-bundle-licenses --version 4.2.0
          bun run package:cli "$TARGET"
      - name: Test SDK with Bun
        if: runner.os != 'Windows'
        run: |
          bun run --bun --cwd bindings/node build:debug
          bun run test:node
      - name: Test native Windows installer
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/test-install.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jio-${{ matrix.target }}
          path: target/dist/jio-${{ matrix.target }}.*
          if-no-files-found: error
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, linux]
    permissions:
      contents: write
    uses: jiovannish/client/.github/workflows/release-draft.yml@91525f1b4184332764c5d23123c75d2605e6ad16
