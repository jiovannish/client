name: Trusted Linux checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    # This immutable workflow is the public runner group's trust boundary.
    if: github.repository == 'jiovannish/client' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-22.04"]') }}
    # Keep the shipped GNU binary runnable on the previous Ubuntu 22 baseline.
    container:
      image: rust:1.94.0-bullseye@sha256:16950191527a4cb9e0762d9d48b705a6315158e4035e64f7a93ce8656a1b053c
    timeout-minutes: 25
    env:
      CARGO_TERM_COLOR: always
      TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Check TypeScript tooling
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run typecheck
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Check and test the CLI
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked -p jio-cli -p jio-client --all-targets -- -D warnings
          cargo test --locked -p jio-cli -p jio-client
          RUSTDOCFLAGS='-D warnings' cargo doc --locked -p jio-cli -p jio-client --no-deps
          bun run test:installer
      - name: Build and package the native binary
        run: |
          cargo build --locked --release -p jio-cli --target "$TARGET"
          "target/$TARGET/release/jio" --version
          cargo install --locked cargo-bundle-licenses --version 4.2.0
          bun run package:cli "$TARGET"
      - name: Test SDK with Bun
        run: |
          bun run --bun --cwd bindings/node build:debug
          bun run test:node
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jio-x86_64-unknown-linux-gnu
          path: target/dist/jio-x86_64-unknown-linux-gnu.*
          if-no-files-found: error
          retention-days: 7
